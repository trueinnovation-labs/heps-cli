apiVersion: heps/v2alpha1
kind: ExperiencePackage

metadata:
  id: __PACKAGE_ID__
  name: "__NAME__"
  version: "__VERSION__"
  description: "A HEPS v2 design package."

# Default directory names — the folder layout below IS the contract, no
# code required. Only override these if you actually rename a directory;
# `heps build` currently always copies these five canonical names regardless
# of what's set here (see docs/heps/known-decisions.md in the HUB repo).
contributes:
  templates:    templates/
  compositions: compositions/
  themes:       themes/
  assets:       assets/
