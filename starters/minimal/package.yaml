# "alpha1" is honest, not decorative: this format can still change in
# ways that break existing packages. Fine for starters, prototypes, and
# real agency work today — just not a "v2 stable" guarantee yet. No
# action needed from you; this is a statement about HEPS, not something
# you set per-package.
apiVersion: heps/v2alpha1
kind: ExperiencePackage

metadata:
  # "agency" here is a namespace, not a fixed value — it's whatever
  # `heps create --namespace <ns>` was given (default: hub.pack), joined
  # to the project name with a dot. The dot has no meaning to HEPS beyond
  # that join; it's a human-readable convention (whose design this is),
  # not a validated or enforced structure.
  id: agency.minimal-starter
  name: "Minimal Starter"
  version: "1.0.0"
  description: "A minimal HEPS v2 design package — one Home template, one Composition, one Theme. Copy this, rename it, and go from here."

# Default directory names — the folder layout below IS the contract, no
# code required. Only override these if you actually rename a directory.
contributes:
  templates:    templates/
  compositions: compositions/
  themes:       themes/
  assets:       assets/
