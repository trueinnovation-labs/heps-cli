apiVersion: heps/v2alpha1
kind: ExperiencePackage

metadata:
  id: agency.commerce-category-starter
  name: "Commerce Category Starter"
  version: "1.0.0"
  description: >
    A HEPS v2 Category design that owns its own Layout instead of using
    one of the HUB's built-in layouts — the structure a real commerce
    category page needs: an editorial intro slot this package authors,
    plus the two Outlets the HUB Runtime renders from the connected
    backend's real product catalog (product count/filters, then the
    product grid itself). No hardcoded products, no backend-specific
    keys — copy this, rename it, and point it at your own category.

contributes:
  templates:    templates/
  layouts:      layouts/
  compositions: compositions/
  themes:       themes/
  assets:       assets/
